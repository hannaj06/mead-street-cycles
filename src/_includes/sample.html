<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mead Street Cycles • Theme Header</title>

<!-- Optional fonts (swap to your own if you like) -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Pacifico&display=swap" rel="stylesheet">

<style>
  :root{
    /* Tweak these to match the jersey exactly */
    --bg:            #ffffff;
    --fg:            #0e1410;
    --green-900:     #14361c; /* darkest band */
    --green-700:     #1e5a2b; /* mid band */
    --green-600:     #2b7a39; /* sleeve stripe / accent */
    --mint-300:      #cfe8d1; /* light checker */
    --mint-400:      #b7dfbf; /* dark checker */
    --shadow:        rgba(0,0,0,.08);
  }

  *{ box-sizing:border-box; }
  body{
    margin:0;
    font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif;
    color:var(--fg);
    background:var(--bg);
  }

  /* ===== Jersey-themed Header ===== */
  .jersey-hero{
    position:relative;
    isolation:isolate;
    display:grid;
    place-items:center;
    min-height:42vh;        /* responsive height */
    padding:3.5rem 1rem 4rem;
    overflow:hidden;
  }

  /* Top/bottom dark bands */
  .jersey-hero::before,
  .jersey-hero::after{
    content:"";
    position:absolute;
    left:0; right:0;
    height:78px;
    background:
      linear-gradient(var(--green-900), var(--green-900)) top/100% 32px no-repeat,
      linear-gradient(var(--green-700), var(--green-700)) top 36px/100% 10px no-repeat,
      linear-gradient(var(--green-900), var(--green-900)) bottom/100% 32px no-repeat;
    z-index:-1;
    box-shadow: inset 0 -1px 0 var(--shadow), inset 0 1px 0 var(--shadow);
  }
  .jersey-hero::before{ top:0; }
  .jersey-hero::after { bottom:0; transform:scaleY(-1); } /* mirror the top stack */

  /* Checker band (sits between dark bands) */
  .checker-band{
    width: 100%;
    height:72px;
    border-radius:6px;
    position:relative;
    box-shadow:0 8px 18px var(--shadow);
    /* 2px mint border like the jersey seam */
    outline:2px solid #e7efe9;
    outline-offset:-4px;

    /* layered background: thin dark stripe, checker, thin dark stripe */
    background:
      /* top thin dark line */
      linear-gradient(var(--green-700),var(--green-700)) top/100% 8px no-repeat,
      /* main checker pattern */
      conic-gradient(from 45deg,
        var(--mint-300) 0 25%, var(--mint-400) 0 50%, var(--mint-300) 0 75%, var(--mint-400) 0 100%)
        center/40px 40px repeat,
      /* bottom thin dark line */
      linear-gradient(var(--green-700),var(--green-700)) bottom/100% 8px no-repeat,
      /* base */
      var(--bg);
  }

  /* Center lockup text */
  .lockup{
    text-align:center;
    margin-top:-2.2rem;     /* visually center between bands */
    line-height:1.05;
    text-wrap:balance;
  }
  .lockup .primary{
    font-family: "Montserrat", system-ui, sans-serif;
    font-weight:800;
    letter-spacing:.02em;
    font-size: clamp(1.6rem, 4.2vw, 3rem);
  }
  .lockup .script{
    display:block;
    font-family:"Pacifico", cursive;
    font-size: clamp(1.2rem, 3.2vw, 2.2rem);
    color: var(--green-700);
    transform: translateY(.05em);
  }

  /* Optional sleeve badges (the green circles with a number) */
  .badge{
    position:absolute;
    top:1.1rem;
    width:52px; aspect-ratio:1;
    border-radius:50%;
    background:var(--green-900);
    color:#e7f4ea;
    display:grid; place-items:center;
    font:700 1.1rem/1 "Montserrat",system-ui,sans-serif;
    box-shadow:0 4px 10px var(--shadow);
  }
  .badge.left{ left:1rem; rotate:-10deg; }
  .badge.right{ right:1rem; rotate:10deg; }

  /* Page filler content to demo continuation */
  .content{
    max-width:1100px;
    margin:2rem auto;
    padding:0 1rem 3rem;
  }


  .site-footer {
  padding-top: 1rem;
  background: var(--green-900);
  color: var(--fg);
  text-align: center;
}
.site-footer .checker-band {
  width: 100%;
  height: 72px;
  margin-bottom: 1rem;
}
  /* Small screens: compress vertical rhythm a touch */
  @media (max-width: 1080px){
    .jersey-hero{ padding:2.4rem 1rem 3rem; }
    .checker-band{ height:64px; }
  }
</style>
</head>
<body>

  <header class="jersey-hero">

    <div class="checker-band" aria-hidden="true"></div>

    <div class="lockup" aria-label="Mead Street Cycles">
      <span class="primary">MEAD STREET</span>
      <span class="script">cycles</span>
    </div>
  </header>

  <main class="content">
    <h2>Welcome</h2>
    <p>
      This header block is your **theme base**. Reuse it at the top of pages or as a hero section
      above your bike grid. Next we can add subtle hover zooms, fade-ins, and a gallery grid that matches these colors.
    </p>
  </main>

  <footer class="site-footer">
  <div class="checker-band"></div>
  <div class="wrap">
    <p>Follow us on Instagram @mead.st.cycles</p>
  </div>
</footer>
</body>
</html>
